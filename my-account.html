<h1>My Account</h1>
<button type="button" id="google-sign-in">Sign in with Google</button>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyDp9tNljoRd02c9Osy_7aEpHk0iqt3imbA",
    authDomain: "kailas-digital-technplogy.firebaseapp.com",
    projectId: "kailas-digital-technplogy",
    storageBucket: "kailas-digital-technplogy.firebasestorage.app",
    messagingSenderId: "882338104239",
    appId: "1:882338104239:web:ccb8ce8d0c1376e20fe55a",
    measurementId: "G-7JJC5G17HH"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
 import {
  getAuth,
  GoogleAuthProvider,
  onAuthStateChanged,
  signInWithPopup,
  signOut
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const auth = getAuth(app);
const button = document.getElementById("google-sign-in");
const status = document.createElement("p");
status.setAttribute("role", "status");
button.after(status);
button.disabled = true;

onAuthStateChanged(auth, (user) => {
  button.textContent = user ? "Sign out" : "Sign in with Google";
  status.textContent = user ? `Signed in as ${user.email || user.displayName}` : "";
  button.disabled = false;
});

button.addEventListener("click", async () => {
  button.disabled = true;
  try {
    if (auth.currentUser) {
      await signOut(auth);
    } else {
      await signInWithPopup(auth, new GoogleAuthProvider());
    }
  } catch (error) {
    status.textContent = `Please try again (${error.code}).`;
  } finally {
    button.disabled = false;
  }
});
</script>
